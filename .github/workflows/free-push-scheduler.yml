name: Rise Upon Deen Free Push Scheduler

on:
  schedule:
    # Five-minute cadence, offset away from the top of the hour.
    - cron: '2/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rise-upon-deen-push-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push-scheduler/package.json
      - name: Install scheduler dependencies
        working-directory: push-scheduler
        run: npm install --omit=dev
      - name: Send queued and prayer notifications
        working-directory: push-scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node index.js
